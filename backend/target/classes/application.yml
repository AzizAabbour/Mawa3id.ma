# ========================================
# Mawa3id.ma Application Configuration
# ========================================

spring:
  application:
    name: mawa3id

  # ---- Database ----
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mawa3id}
    username: ${DATABASE_USERNAME:mawa3id}
    password: ${DATABASE_PASSWORD:mawa3id}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: Africa/Casablanca
    open-in-view: false

  # ---- Flyway ----
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mawa3id}
    password: ${RABBITMQ_PASSWORD:mawa3id}
    virtual-host: /

  # ---- Mail ----
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Casablanca
    default-property-inclusion: non_null

# ========================================
# Application Custom Properties
# ========================================

app:
  jwt:
    secret: ${JWT_SECRET:mawa3id-dev-secret-key-change-in-production-must-be-at-least-256-bits-long}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  notification:
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:false}
      api-url: ${WHATSAPP_API_URL:}
      api-key: ${WHATSAPP_API_KEY:}
    sms:
      enabled: ${SMS_ENABLED:false}
      api-url: ${SMS_API_URL:}
      api-key: ${SMS_API_KEY:}
    email:
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:noreply@mawa3id.ma}

  rabbitmq:
    exchange: mawa3id.notifications
    queue:
      send: mawa3id.notifications.send
      dlq: mawa3id.notifications.dlq
    routing-key:
      send: notification.send

  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# ========================================
# Server Configuration
# ========================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ========================================
# Actuator
# ========================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      show-details: when_authorized

# ========================================
# OpenAPI / Swagger
# ========================================

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ========================================
# Logging
# ========================================

logging:
  level:
    ma.mawa3id: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
